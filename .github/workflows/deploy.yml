name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
      RELEASE_DIR: release
      DEPLOY_PATH: /var/www/qr.k-innovative.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare release bundle (build output only)
        run: |
          rm -rf "${{ env.RELEASE_DIR }}"
          mkdir -p "${{ env.RELEASE_DIR }}"

          # Standalone server + minimal runtime deps
          cp -r .next/standalone/. "${{ env.RELEASE_DIR }}/"

          # Static assets required at runtime (not included in standalone copy)
          mkdir -p "${{ env.RELEASE_DIR }}/.next"
          cp -r .next/static "${{ env.RELEASE_DIR }}/.next/static"

          # Public files (favicon, etc.)
          cp -r public "${{ env.RELEASE_DIR }}/public"

          echo "Release bundle contents:"
          du -sh "${{ env.RELEASE_DIR }}"
          find "${{ env.RELEASE_DIR }}" -maxdepth 3 -type d | head -30

      - name: Copy build files to server via SSH (rsync)
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes" \
            "${{ env.RELEASE_DIR }}/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Restart application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"
            export NODE_ENV=production
            export PORT="${{ secrets.APP_PORT || '3000' }}"

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete qr-studio 2>/dev/null || true
              pm2 start server.js --name qr-studio
              pm2 save
            else
              pkill -f "node.*server.js" 2>/dev/null || true
              nohup node server.js > app.log 2>&1 &
            fi
